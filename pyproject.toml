[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topk_decoding"
version = "0.0.1"
description = "Topk decoding"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    {name = "Ryan Synk", email="ryansynk@umd.edu"},
    {name = "Monte Hoover", email="mhoover4@umd.edu"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "transformers",
    "torch",
    "einops",
    "faiss-cpu",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
]

[project.urls]
Homepage = "https://github.com/ryansynk/topk-decoding"
Issues = "https://github.com/ryansynk/topk-decoding/issues"

[project.scripts]
topk-run = "project_setup.run:main"

[tool.setuptools]
packages = ["topk_decoding", "project_setup"]

[tool.setuptools.package-dir]
topk_decoding = "src/topk_decoding"
project_setup = "project_setup"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = ["."]
